name: clamav

services:
  clamav:
    image: bmmbmm01/clamav-alpine:${IMAGE_TAG:-latest}
    container_name: clamav
    restart: "no"

    environment:
      TZ: ${TZ:-America/Chicago}
      SCAN_FOLDERS: ${SCAN_FOLDERS:-/scan}
      EXCLUDE_PATHS: "${EXCLUDE_PATHS:-}"

    volumes:
      # Data to scan.
      - ${SCAN_PATH:-./scan}:/scan:ro

      # Persistent ClamAV signature database.
      - ${CLAMAV_DB_PATH:-./db}:/var/lib/clamav:rw

      # Persistent ClamAV logs and previous-run history.
      - ${CLAMAV_LOG_PATH:-./log}:/var/log/clamav:rw

      # Persistent end-user-editable ClamAV configuration.
      # On first run, missing clamd.conf/freshclam.conf are copied from the
      # maintainer defaults stored inside the image under /build.
      # Existing files are preserved unchanged on every later run.
      - ${CLAMAV_ETC_PATH:-./etc}:/etc/clamav:rw

    pids_limit: 2048

    logging:
      driver: local
      options:
        max-size: "50m"
        max-file: "3"
